<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Advertisement</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      padding: 40px;
    }
    .product-card {
      position: relative;
      width: 240px;
      padding: 20px;
      background: white;
      border: 2px solid #ccc;
      border-radius: 8px;
      text-align: center;
    }
    .sale-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #e63946;
      color: white;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
    }
    .help-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2a9d8f;
      color: white;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="product-card">
    <span class="sale-badge">SALE</span>
    <h3>Wireless Headphones</h3>
    <p>Noise-canceling with 30-hour battery life.</p>
    <p><strong>$49.99</strong></p>
  </div>

  <button class="help-btn">Chat With Us</button>

</body>
</html>
